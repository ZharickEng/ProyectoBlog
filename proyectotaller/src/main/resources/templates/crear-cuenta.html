<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/crearcuenta.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />

    <title>Matiz</title>
  </head>
  <body>
    <div th:replace="~{fragmentos :: header}"></div>

    <section class="tarjeta">
      <h1>Crear cuenta</h1>

      <form class="formulario">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" required />

        <label for="email">Correo electronico</label>
        <input type="email" id="email" name="email" required />

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required />

        <label for="contrasena-confirmada">Confirmar contraseña</label>
        <input
          type="password"
          id="contrasena-confirmada"
          name="contrasena-confirmada"
          required
        />
        <input
          class="boton"
          type="checkbox"
          id="terminos"
          name="terminos"
          required
        />
        <label for="Terminos">
          <a href="#">Acepto los términos y condiciones</a>
        </label>
        <button type="submit">Registrar</button>
      </form>
    </section>
  </body>
</html>
