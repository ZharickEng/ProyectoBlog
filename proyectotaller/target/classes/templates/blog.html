<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/blog.css}" />
    <link rel="stylesheet" th:href="@{/css/base.css}" />

    <title>Matiz</title>
  </head>
  <body>
    <div th:replace="~{fragmentos :: header}"></div>

    <section class="estructura">
      <div class="nombre-descripcion">
        <form>
          <label for="nombre">Nombre de tu blog</label>
          <input type="text" id="nombre" name="nombre" required />

          <label for="descripcion">Describe tu blog</label>
          <textarea></textarea>

          <div class="Filtra"></div>
          <input type="radio" id="filtros" name="filtros" />
          <label for="filtros"
            >¿A que categoria crees que entraria tu blog?</label
          >
        </form>
      </div>
    </section>
  </body>
</html>
